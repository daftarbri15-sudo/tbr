
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Service | Buku Agen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003087;
            --primary-light: #0046c7;
            --accent: #25D366;
            --verify-blue: #0095f6;
            --text-main: #1F2937;
            --bg-body: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.05) 1px, transparent 0);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px; /* Memberi ruang lebih di luar kartu */
        }

        .card {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 45px 20px 35px; /* Menambah tinggi header (Padding Atas/Bawah) */
            text-align: center;
            color: white;
            position: relative;
        }

        .logo-box {
            width: 110px; 
            height: 110px; 
            background: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: scale(1.05);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .verify-badge {
            color: var(--verify-blue);
            display: flex;
            align-items: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 5px;
        }

        .dot-container {
            position: relative;
            width: 9px;
            height: 9px;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
        }

        .dot-pulse {
            width: 9px;
            height: 9px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            80%, 100% { transform: scale(2.8); opacity: 0; }
        }

        .content {
            padding: 35px 25px 40px; /* Menambah tinggi konten bawah (Padding Atas/Bawah) */
            flex: 1;
        }

        .help-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .help-item {
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            padding: 18px 5px;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .help-item:hover {
            background: #ffffff;
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
        }

        .help-item .icon-box {
            width: 42px;
            height: 42px;
            background: #edf2f7;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            color: var(--primary);
            transition: 0.3s;
        }

        .help-item:hover .icon-box {
            background: var(--primary);
            color: white;
        }

        .help-item span {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            display: block;
        }

        .btn-wa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 24px;
            font-weight: 800;
            font-size: 17px;
            box-shadow: 0 12px 28px rgba(37, 211, 102, 0.4);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .btn-wa:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.5);
        }

        .btn-wa::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 200%;
            height: 200%;
            background: linear-gradient(rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .footer {
            padding: 25px 20px;
            text-align: center;
            background: #fcfdfe;
            border-top: 1px solid #f1f5f9;
        }

        .footer-tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            color: #475569;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .copyright {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>
